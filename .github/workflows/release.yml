# This GitHub action can publish assets for release when a tag is created.
# Currently its setup to run on any tag that matches the pattern "v*" (ie. v0.1.0).
#
# This uses an action (hashicorp/ghaction-import-gpg) that assumes you set your
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
# You will need to pass the `--batch` flag to `gpg` in your signing step
# in `goreleaser` to indicate this is being used in a non-interactive mode.
#
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release-notes:
    name: "Release Notes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Extract CHANGELOG.md section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = (index($0, "## " v " ") == 1 || $0 == "## " v); next} p' CHANGELOG.md > release-notes.txt
          if [ ! -s release-notes.txt ]; then
            echo "::error file=CHANGELOG.md::No '## ${version}' section found in CHANGELOG.md"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.txt
          retention-days: 1
  terraform-provider-release:
    name: "Terraform Provider Release"
    needs: release-notes
    uses: hashicorp/ghaction-terraform-provider-release/.github/workflows/community.yml@v5
    secrets:
      gpg-private-key: "${{ secrets.GPG_PRIVATE_KEY }}"
      gpg-private-key-passphrase: "${{ secrets.PASSPHRASE }}"
    with:
      release-notes: true
      setup-go-version-file: "go.mod"