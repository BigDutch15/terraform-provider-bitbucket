# Terraform Provider release workflow, based on
# hashicorp/terraform-provider-scaffolding-framework.
#
# Runs on tags matching "v*" (e.g. v1.0.0). Requires the GPG_PRIVATE_KEY and
# PASSPHRASE secrets; GoReleaser signs the checksums file with that key.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release-notes:
    name: "Release Notes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract CHANGELOG.md section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = (index($0, "## " v " ") == 1 || $0 == "## " v); next} p' CHANGELOG.md > release-notes.txt
          if [ ! -s release-notes.txt ]; then
            echo "::error file=CHANGELOG.md::No '## ${version}' section found in CHANGELOG.md"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.txt
          retention-days: 1

  goreleaser:
    needs: release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history and tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          # No cache restore in the release job.
          cache: false

      # Download outside the checkout: GoReleaser refuses to release from a
      # git tree with untracked files.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --release-notes ${{ runner.temp }}/release-notes/release-notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
